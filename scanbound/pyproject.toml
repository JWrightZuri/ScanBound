[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanbound"
version = "0.1.0"
description = "UI-independent detection core of ScanBound: image preprocessing, segmentation, ROI extraction, measurement and labelling of nanostructures in SPM images."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "opencv-python>=4.8",
    "pandas>=2.0",
    "pillow>=10",
]

[project.optional-dependencies]
# the desktop app (python -m scanbound.app); the same wheels exist for Windows, macOS (Intel and Apple
# silicon) and Linux x86_64 / aarch64
gui = ["PyQt6>=6.5", "pyqtgraph>=0.13.7", "PyOpenGL>=3.1.7", "matplotlib>=3.7"]
clusters = ["scikit-learn>=1.3"]
formats = ["rosettasciio", "tifffile", "gwyfile", "access2thematrix"]
ml = ["ultralytics>=8.3"]
all = ["scanbound[gui,clusters,formats]"]
dev = ["pytest>=7", "mypy>=1.5", "scikit-learn>=1.3"]

[project.scripts]
scanbound = "scanbound.cli:main"

[project.gui-scripts]
scanbound-app = "scanbound.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scanbound = ["py.typed", "tutorial/*.sxm", "app/resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
